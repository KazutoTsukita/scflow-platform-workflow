name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install --upgrade pip build && python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q uniscflow.py tools tests
      - name: Shell syntax
        run: find . -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
      - name: Build source and wheel distributions
        run: python -m build
      - name: Installed runtime smoke test
        run: |
          cd /tmp
          uniscflow --version
          uniscflow --help >/dev/null
          python -c 'import os, pathlib, uniscflow; source = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "profiles/platforms"; installed = uniscflow.ROOT / "profiles/platforms"; assert (uniscflow.ROOT / "tools/legacy/All_in_one_download_NCBI.sh").is_file(); assert {path.name for path in installed.glob("*.json")} == {path.name for path in source.glob("*.json")}'

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the current source image
        run: bash docker/build_current_image.sh
