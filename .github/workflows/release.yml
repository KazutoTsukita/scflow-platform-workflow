name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag and release metadata
        run: python scripts/verify_release.py --tag "${GITHUB_REF_NAME}"
      - name: Test and build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  container:
    needs: verify-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release version
        id: release
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kazutotsukita/scflow-platform-workflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UNISCFLOW_VERSION=${{ steps.release.outputs.version }}
            UNISCFLOW_GIT_COMMIT=${{ github.sha }}
            UNISCFLOW_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        run: printf '%s@%s\n' 'ghcr.io/kazutotsukita/scflow-platform-workflow' '${{ steps.build.outputs.digest }}' > container-image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: container-image-digest
          path: container-image-digest.txt

  github-release:
    needs: [verify-and-package, container]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: container-image-digest
          path: dist
      - name: Create immutable GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "UniScFlow ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md dist/*
